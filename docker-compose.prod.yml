# Продакшн-запуск SoyleUp: api + web + postgres + redis + minio (хранилище) + caddy (HTTPS).
#
# Перед первым запуском:
#   1. cp .env.prod.example .env            — задать DOMAIN и ACME_EMAIL (для Caddy/HTTPS)
#   2. cp apps/api/.env.example apps/api/.env — заполнить реальными секретами (см. apps/api/.env.example)
#      NODE_ENV=production, WEB_ORIGIN=https://<домен>,
#      S3_ENDPOINT=https://storage.<домен>, S3_PUBLIC_URL_BASE=https://storage.<домен>/content
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# Подробный пошаговый гайд (аренда VPS, домен, DNS, первый запуск) — см. DEPLOY.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soyleup
      POSTGRES_PASSWORD: soyleup
      POSTGRES_DB: soyleup
    volumes: [pgdata:/var/lib/postgresql/data]
    # Порт только на localhost сервера — для бэкапов/отладки через SSH-туннель, не наружу
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soyleup"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redisdata:/data]
    command: redis-server --save 60 1 --appendonly yes

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-soyleup}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?укажите S3_SECRET_KEY в .env}
    volumes: [miniodata:/data]
    command: server /data --console-address ":9001"
    # 9000 (S3 API) отдаётся наружу через Caddy (storage.<домен>) — нужен для публичных
    # файлов контента и presigned-загрузок. 9001 (консоль администратора) — только localhost,
    # доступ через SSH-туннель: ssh -L 9001:localhost:9001 <пользователь>@<сервер>
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://soyleup:soyleup@postgres:5432/soyleup?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:3001/api/v1
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - minio

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
